[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-dns-zone-auditor"
version = "0.1.0"
description = "Offline DNS zone hygiene auditor for OCI-style zone exports: CNAME conflicts, leaked private IPs, missing SPF/DMARC, dangling cloud CNAMEs, TTL and wildcard checks on synthetic data"
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
dns-audit = "dns_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
